alg_name: HOPEDIT
model_name: Qwen/Qwen2.5-7B-Instruct
device: 0
model_parallel: false
batch_size: 1
max_length: 512
use_chat_template: false
fp16: false
bf16: true

rank: 8
lora_alpha: 16
lora_dropout: 0.0
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
num_steps: 4
lr: 5.0e-4
weight_decay: 0.0

top_k: 4
beta: 8.0
semantic_weight: 0.7
activation_weight: 0.3
probe_layer: 16
probe_layers:
  - 12
  - 16
  - 20
route_log_dir: ./outputs/hopedit_smoke
route_strategy: staged
min_route_prob: 0.55
min_route_margin: 0.20
fallback_min_route_prob: 0.48
fallback_min_route_margin: 0.10
activation_center: true
activation_whiten: false
key_l2_normalize: true
use_rephrase_prompt: true
use_subject_prompt: true
negative_top_k: 2
negative_weight: 0.5
negative_margin: 0.20
negative_min_conflict: 0.45
save_path: null
